name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试（物理 / 序列化 / 搜索 / 题库 / 建模库 / UI 纯逻辑）
        run: npm test
      - name: 文档行数与代码一致
        run: npm run doc:check
